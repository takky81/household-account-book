name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: 決定表
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      # jsonl がすべて読めること、決定表として矛盾がないことを確かめる。
      # 列番号の重複や同じ列での行の重複があれば build が落ちる。
      - name: 決定表を生成する
        working-directory: spec
        run: npm run build
      # すべての列がテストで押さえられていることを確かめる。
      # 押さえられていない列があれば落ちる。
      - name: 決定表のカバレッジ
        working-directory: spec
        run: npm run coverage

  db:
    name: データベース
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      # RLS と RPC の検査は pgTAP で行う（supabase/tests/*.test.sql）。
      # マイグレーションが流れることも、ここで一緒に確かめている。
      - name: ローカル Supabase を立ち上げる
        run: supabase start
      - name: DB のテスト
        run: supabase test db
      - name: 片づける
        if: always()
        run: supabase stop

  app:
    name: アプリ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: 型を検査する
        run: npm run typecheck
      - name: ユニットテスト
        run: npm test
      - name: ビルド
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54421
          VITE_SUPABASE_ANON_KEY: dummy-for-build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: npm ci
      - name: ブラウザを入れる
        run: npx playwright install --with-deps chromium
      - name: ローカル Supabase を立ち上げる
        run: supabase start
      # 開発サーバーが読む .env.local を、立ち上げた Supabase の値から作る
      - name: 接続先を書き出す
        run: |
          echo "VITE_SUPABASE_URL=$(supabase status -o json | jq -r .API_URL)" >> .env.local
          echo "VITE_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)" >> .env.local
      - name: E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
      - name: 片づける
        if: always()
        run: supabase stop
